name: QA
on:
  push:
  pull_request:
jobs:
  render-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Sync strict official calibration assets
        run: python scripts/sync_calibration_assets.py
      - name: Render Telegram GitHub Discord glass-in-glass calibration
        run: python scripts/render_glass_calibration.py
      - name: Validate transparency colorlessness and provenance
        run: python scripts/validate_glass_calibration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-in-glass-calibration
          path: |
            generated/calibration/
            generated/contact-sheets/glass-in-glass-calibration.png
            generated/contact-sheets/glass-in-glass-edges.png
            artwork/official/provenance.json
