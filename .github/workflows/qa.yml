name: QA
on:
  push:
  pull_request:
jobs:
  render-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/sync_official_assets_ci.py
      - run: python renderer/offline_renderer/render.py --all
      - run: python renderer/offline_renderer/validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-previews
          path: |
            generated/contact-sheets/
            variants/regular/
            artwork/official/provenance.json
